<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Example illustration for a new Illustrated Story: a door on a rainy night.
       Replace it with your own pictures in the images/ folder. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#26354f"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/>
      <stop offset="1" stop-color="#2a2d36"/>
    </linearGradient>
    <linearGradient id="doorwood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3622"/>
      <stop offset="1" stop-color="#6e4329"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffb347" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf73" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffcf73" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rain" width="60" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <line x1="10" y1="0" x2="10" y2="26" stroke="#9fb4d6" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
      <line x1="40" y1="45" x2="40" y2="66" stroke="#9fb4d6" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
    </pattern>
  </defs>

  <!-- Night sky and moon -->
  <rect width="1280" height="720" fill="url(#sky)"/>
  <circle cx="1080" cy="120" r="46" fill="#dfe6f2" fill-opacity="0.85"/>
  <circle cx="1098" cy="108" r="44" fill="#16213a" fill-opacity="0.9"/>

  <!-- Cottage wall with stones -->
  <rect x="260" y="150" width="760" height="570" fill="url(#wall)"/>
  <polygon points="220,160 640,20 1060,160" fill="#1c1f27"/>
  <g fill="none" stroke="#4a505e" stroke-width="3" stroke-opacity="0.7">
    <path d="M300 230h90M420 215h110M840 225h120M880 300h100M300 330h70M300 450h100M880 430h110M300 580h90M860 560h120M880 660h100M320 680h80"/>
  </g>

  <!-- Warm light glowing from the doorway -->
  <ellipse cx="640" cy="470" rx="330" ry="300" fill="url(#glow)"/>
  <polygon points="560,720 720,720 900,720 820,700 720,560 560,560" fill="url(#spill)"/>

  <!-- Doorway: open gap with light, and the door itself -->
  <path d="M540 720V420a100 100 0 0 1 200 0v300z" fill="#ffd98a"/>
  <path d="M540 720V420a100 100 0 0 1 120 -92v392z" fill="url(#doorwood)" stroke="#2b1a10" stroke-width="6"/>
  <g stroke="#3f2616" stroke-width="4" stroke-opacity="0.8">
    <line x1="580" y1="360" x2="580" y2="718"/>
    <line x1="620" y1="336" x2="620" y2="718"/>
  </g>
  <circle cx="645" cy="560" r="9" fill="#c9a24a"/>
  <path d="M532 720V420a108 108 0 0 1 216 0v300" fill="none" stroke="#23252c" stroke-width="16"/>

  <!-- Lantern beside the door -->
  <line x1="790" y1="360" x2="790" y2="392" stroke="#1a1a1a" stroke-width="5"/>
  <rect x="770" y="392" width="40" height="54" rx="6" fill="#ffcf6b" stroke="#1a1a1a" stroke-width="5"/>
  <circle cx="790" cy="419" r="60" fill="#ffcf6b" fill-opacity="0.18"/>

  <!-- Ground -->
  <rect x="0" y="690" width="1280" height="30" fill="#161a22"/>

  <!-- Rain over everything -->
  <rect width="1280" height="720" fill="url(#rain)"/>
</svg>
